<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
  #canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:20px; height:20px; }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.9); border-radius:2px; }
  #crosshair::before { width:2px; height:100%; top:0; left:50%; transform:translateX(-50%); }
  #crosshair::after  { width:100%; height:2px; top:50%; left:0; transform:translateY(-50%); }
  #hud { position:absolute; bottom:24px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 32px; }
  .hud-block { display:flex; flex-direction:column; gap:4px; }
  .hud-label { font-size:10px; letter-spacing:3px; color:rgba(255,255,255,0.4); text-transform:uppercase; }
  .hud-value { font-size:28px; font-weight:bold; color:#fff; letter-spacing:2px; }
  #ammo-display { text-align:right; }
  #ammo-display .hud-value { color:#f0b429; }
  #speed-indicator { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); text-align:center; }
  #sprint-bar-bg { width:120px; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; overflow:hidden; margin-top:6px; }
  #sprint-bar { height:100%; background:#4ade80; border-radius:2px; width:100%; transition:width 0.1s; }
  #status-pills { position:absolute; top:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .pill { padding:4px 14px; border-radius:20px; font-size:11px; letter-spacing:2px; font-weight:bold; text-transform:uppercase; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.5); transition:all 0.2s; }
  .pill.active { background:rgba(74,222,128,0.15); border-color:#4ade80; color:#4ade80; }
  #player-count { position:absolute; top:20px; right:24px; color:rgba(255,255,255,0.5); font-size:12px; letter-spacing:2px; }
  #lockscreen { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; gap:14px; }
  #lockscreen h1 { font-size:48px; color:#fff; letter-spacing:8px; text-transform:uppercase; }
  #lockscreen p  { color:rgba(255,255,255,0.45); letter-spacing:2px; font-size:13px; }
  #start-btn { margin-top:8px; padding:12px 40px; background:#fff; color:#000; border:none; font-family:'Courier New',monospace; font-size:14px; letter-spacing:4px; text-transform:uppercase; cursor:pointer; font-weight:bold; }
  #start-btn:hover { background:#f0b429; }
  .controls-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 32px; margin-top:4px; }
  .ctrl { color:rgba(255,255,255,0.6); font-size:12px; letter-spacing:1px; }
  .ctrl span { color:#f0b429; margin-right:8px; font-weight:bold; }
  #muzzle-flash { position:fixed; inset:0; background:radial-gradient(ellipse at center bottom,rgba(255,200,50,0.18) 0%,transparent 70%); opacity:0; pointer-events:none; z-index:9; transition:opacity 0.05s; }
  #muzzle-flash.flash { opacity:1; }
  #health-bar-bg { width:160px; height:6px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; margin-top:6px; }
  #health-bar { height:100%; background:#ef4444; border-radius:3px; width:100%; transition:width 0.3s; }
  #weapon-name { position:absolute; bottom:80px; right:32px; color:rgba(255,255,255,0.7); font-size:13px; letter-spacing:3px; text-transform:uppercase; opacity:0; transition:opacity 0.3s; }
  #weapon-name.show { opacity:1; }
  #connection-status { position:absolute; top:20px; left:24px; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.4); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#ef4444; margin-right:6px; vertical-align:middle; }
  .dot.online { background:#4ade80; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="crosshair"></div>
  <div id="status-pills">
    <div class="pill" id="pill-sprint">Sprint</div>
    <div class="pill" id="pill-jump">Air</div>
    <div class="pill" id="pill-shoot">Fire</div>
  </div>
  <div id="connection-status"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting...</span></div>
  <div id="player-count">1 / 12 players</div>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Health</div>
      <div class="hud-value" id="hp-value">100</div>
      <div id="health-bar-bg"><div id="health-bar"></div></div>
    </div>
    <div class="hud-block" id="speed-indicator">
      <div class="hud-label">Stamina</div>

<div id="lockscreen">

<script>

const MY_ID = 'player_' + Math.random().toString(36).slice(2,10);
let myLobby = null;
let gameStarted = false;

// ─── Renderer ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);

// ─── Environment ──────────────────────────────────────────────────────────────
function box(w,h,d,color,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y+h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
}
const CC=0x8B6914;
box(2,2,2,CC,8,0,8); box(2,2,2,CC,8,0,10); box(2,4,2,CC,10,0,8);
box(2,2,2,CC,-12,0,5); box(2,2,2,CC,-14,0,5); box(2,2,2,CC,-13,2,5);
box(2,2,2,CC,5,0,-15); box(4,1,4,CC,-5,0,-10); box(4,1,4,CC,-5,1,-10);
box(20,3,1,0x888888,0,0,-30); box(1,3,20,0x888888,25,0,0);
box(20,3,1,0x888888,0,0,30);  box(1,3,20,0x888888,-25,0,0);
for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2; box(1,5,1,0x555555,Math.cos(a)*18,0,Math.sin(a)*18);}
[{x:15,z:-15,rx:-0.28},{x:-15,z:15,rx:0.28}].forEach(r=>{

  m.position.set(r.x,0.8,r.z); m.rotation.x=r.rx; m.castShadow=true; scene.add(m);
});

// ─── Local Player ─────────────────────────────────────────────────────────────
const PH=1.8, PR=0.4, EYE=1.6;
const pState = {
  pos: new THREE.Vector3(0,PH,5),
  vel: new THREE.Vector3(),
  yaw:0, pitch:0,
  onGround:false,
  stamina:100, health:100,
  ammo:30, reserve:90,
  reloading:false, reloadTimer:0,
  shootCD:0, weaponIdx:0
};

function makeCapsule(color){
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color});
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,PH-PR*2,12),mat);
  cyl.castShadow=true; g.add(cyl);
  [1,-1].forEach(s=>{
    const sp=new THREE.Mesh(new THREE.SphereGeometry(PR,12,8),mat);
    sp.position.y=s*(PH-PR*2)/2; sp.castShadow=true; g.add(sp);
  });
  return g;
}

const playerGroup = makeCapsule(0x2255aa);
playerGroup.position.copy(pState.pos);
scene.add(playerGroup);

// ─── Remote Players ───────────────────────────────────────────────────────────
const remotePlayers = {}; // id -> { mesh, target:{x,y,z,yaw} }
const REMOTE_COLORS = [0xaa2222,0x22aa44,0xaa6600,0x8822aa,0x22aaaa,0xaa2288,0x226622,0xaa4422];

function spawnRemote(id, state){
  if(remotePlayers[id] || id===MY_ID) return;
  const colorIdx = Object.keys(remotePlayers).length % REMOTE_COLORS.length;
  const mesh = makeCapsule(REMOTE_COLORS[colorIdx]);
  mesh.position.set(state.x||0, state.y||PH, state.z||5);
  scene.add(mesh);
  remotePlayers[id] = { mesh, target:{x:state.x||0,y:state.y||PH,z:state.z||5,yaw:state.yaw||0} };
  updatePlayerCount();
}

function removeRemote(id){
  if(remotePlayers[id]){ scene.remove(remotePlayers[id].mesh); delete remotePlayers[id]; }
  updatePlayerCount();
}

function updatePlayerCount(){
  const total = 1 + Object.keys(remotePlayers).length;
  document.getElementById('player-count').textContent = `${total} / ${LOBBY_SIZE} players`;
}

// ─── Weapons ──────────────────────────────────────────────────────────────────
const WEAPONS=[
  {name:'Assault Rifle',fireRate:0.1,ammoMax:30,reserveMax:90,reloadTime:2.0,auto:true},
  {name:'Sniper Rifle', fireRate:1.2,ammoMax:5, reserveMax:25,reloadTime:3.0,auto:false},
];

function makeRifle(){
  const g=new THREE.Group();
  const add=(geo,col,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);g.add(m);};
  add(new THREE.BoxGeometry(0.06,0.06,0.4),0x333333,0,0,0);
  add(new THREE.BoxGeometry(0.03,0.03,0.28),0x222222,0,0.01,-0.33);
  add(new THREE.BoxGeometry(0.05,0.06,0.16),0x5a3a1a,0,-0.01,0.26);
  add(new THREE.BoxGeometry(0.04,0.10,0.04),0x5a3a1a,0,-0.07,0.08);
  add(new THREE.BoxGeometry(0.04,0.10,0.06),0x222222,0,-0.09,-0.03);
  add(new THREE.BoxGeometry(0.03,0.03,0.12),0x111111,0,0.05,-0.05);
  return g;
}
function makeSniper(){
  const g=new THREE.Group();
  const add=(geo,col,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);g.add(m);};
  add(new THREE.BoxGeometry(0.055,0.055,0.55),0x2a2a2a,0,0,0);
  add(new THREE.BoxGeometry(0.025,0.025,0.40),0x111111,0,0.01,-0.46);
  add(new THREE.BoxGeometry(0.04,0.04,0.22),0x4a2a0a,0,-0.01,0.34);
  add(new THREE.BoxGeometry(0.035,0.09,0.04),0x4a2a0a,0,-0.09,0.12);
  add(new THREE.BoxGeometry(0.03,0.07,0.05),0x111111,0,-0.09,-0.04);
  add(new THREE.BoxGeometry(0.06,0.06,0.22),0x111111,0,0.07,-0.06);
  return g;
}
const weaponModels=[makeRifle(),makeSniper()];
const weaponHolder=new THREE.Group();
camera.add(weaponHolder);
weaponModels.forEach(m=>weaponHolder.add(m));

function switchWeapon(idx){
  pState.weaponIdx=idx;
  weaponModels.forEach((m,i)=>m.visible=(i===idx));
  weaponModels[0].position.set(0.22,-0.18,-0.35); weaponModels[0].rotation.set(0,Math.PI,0);
  weaponModels[1].position.set(0.22,-0.18,-0.38); weaponModels[1].rotation.set(0,Math.PI,0);
  const wn=document.getElementById('weapon-name');
  wn.textContent=WEAPONS[idx].name; wn.classList.add('show');
  setTimeout(()=>wn.classList.remove('show'),1500);
  pState.ammo=WEAPONS[idx].ammoMax; pState.reserve=WEAPONS[idx].reserveMax;
  pState.reloading=false; updateAmmoHUD();
}
switchWeapon(0);

// ─── Tracers ──────────────────────────────────────────────────────────────────
const tracers=[];
function spawnTracer(from,dir){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.6,4),new THREE.MeshBasicMaterial({color:0xffdd44}));
  m.position.copy(from);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  scene.add(m); tracers.push({mesh:m,vel:dir.clone().multiplyScalar(40),life:0.15});
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateAmmoHUD(){
  document.getElementById('ammo-value').textContent=
    pState.reloading?'RELOADING...':`${pState.ammo} / ${pState.reserve}`;
}
function updateHealthHUD(){
  document.getElementById('hp-value').textContent=pState.health;
  document.getElementById('health-bar').style.width=pState.health+'%';
}
function setConnectionStatus(online, text){
  document.getElementById('conn-dot').className='dot'+(online?' online':'');

}

// ─── Shooting ─────────────────────────────────────────────────────────────────
const muzzleFlash=document.getElementById('muzzle-flash');
const pillShoot=document.getElementById('pill-shoot');
const recoilOff=new THREE.Vector3();

function shoot(){
  if(pState.ammo<=0||pState.reloading){startReload();return;}
  const wpn=WEAPONS[pState.weaponIdx];
  pState.ammo--; pState.shootCD=wpn.fireRate; updateAmmoHUD();
  muzzleFlash.classList.add('flash'); setTimeout(()=>muzzleFlash.classList.remove('flash'),60);
  pillShoot.classList.add('active');  setTimeout(()=>pillShoot.classList.remove('active'),80);
  recoilOff.y+=0.015; recoilOff.x+=(Math.random()-0.5)*0.008;
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  spawnTracer(camera.position.clone().add(dir.clone().multiplyScalar(0.5)),dir);
}
function startReload(){
  const wpn=WEAPONS[pState.weaponIdx];
  if(pState.reserve<=0||pState.ammo===wpn.ammoMax||pState.reloading) return;
  pState.reloading=true; pState.reloadTimer=wpn.reloadTime; updateAmmoHUD();
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys={};
let mouseDown=false, prevMouseDown=false;
let rmbDown=false, lastDragX=0, lastDragY=0;

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Digit1') switchWeapon(0);
  if(e.code==='Digit2') switchWeapon(1);
  if(e.code==='KeyR'&&!pState.reloading) startReload();
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });

canvas.addEventListener('mousedown',e=>{
  if(!gameStarted) return;
  if(e.button===0) mouseDown=true;
  if(e.button===2){ rmbDown=true; lastDragX=e.clientX; lastDragY=e.clientY; }
});
window.addEventListener('mouseup',e=>{
  if(e.button===0) mouseDown=false;
  if(e.button===2) rmbDown=false;
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('mousemove',e=>{
  if(!gameStarted||!rmbDown) return;
  pState.yaw   -= (e.clientX-lastDragX)*0.004;
  pState.pitch -= (e.clientY-lastDragY)*0.004;
  pState.pitch  = Math.max(-1.4,Math.min(1.4,pState.pitch));
  lastDragX=e.clientX; lastDragY=e.clientY;
});

document.getElementById('start-btn').addEventListener('click',()=>{

  document.getElementById('lockscreen').style.display='none';
  gameStarted=true;
});

// ─── Supabase Multiplayer ─────────────────────────────────────────────────────
async function findLobby(){
  // Get all active players (updated in last 10 seconds)
  const cutoff = Date.now() - 10000;
  const { data, error } = await sb.from('players').select('lobby').gt('updated_at', cutoff);

  if(error){ setConnectionStatus(false,'DB Error: '+error.message); console.error('Supabase error:', JSON.stringify(error)); alert('Supabase error: ' + error.message + '\nCode: ' + error.code + '\nDetails: ' + error.details); return; }

  // Count players per lobby
  const counts = {};
  (data||[]).forEach(row=>{ counts[row.lobby]=(counts[row.lobby]||0)+1; });

  // Find a lobby with room
  let chosenLobby = null;
  for(const lid in counts){
    if(counts[lid] < LOBBY_SIZE){ chosenLobby=lid; break; }
  }
  // If none found, make a new one
  if(!chosenLobby) chosenLobby = 'lobby_' + Math.random().toString(36).slice(2,8);

  myLobby = chosenLobby;
  document.getElementById('lobby-info').textContent = `Lobby: ${myLobby}`;
  setConnectionStatus(true, 'Connected');

  // Insert my player row
  await sb.from('players').upsert({
    id: MY_ID, lobby: myLobby,
    x:0, y:PH, z:5, yaw:0, health:100,
    updated_at: Date.now()
  });

  // Load existing players in this lobby
  const { data: existing } = await sb.from('players').select('*')
    .eq('lobby', myLobby).neq('id', MY_ID).gt('updated_at', cutoff);
  (existing||[]).forEach(p=>spawnRemote(p.id, p));

  // Subscribe to realtime changes in this lobby
  sb.channel('lobby:'+myLobby)
    .on('postgres_changes',
      { event:'*', schema:'public', table:'players', filter:`lobby=eq.${myLobby}` },
      (payload)=>{
        const row = payload.new || payload.old;
        if(!row || row.id===MY_ID) return;

        if(payload.eventType==='DELETE'){
          removeRemote(row.id);
        } else {
          // Spawn if new, update target if existing
          if(!remotePlayers[row.id]) spawnRemote(row.id, row);
          else remotePlayers[row.id].target = { x:row.x, y:row.y, z:row.z, yaw:row.yaw };
        }
      }
    ).subscribe();

  // Send my position every 100ms
  setInterval(pushPosition, 100);

  // Clean up my row when leaving
  window.addEventListener('beforeunload', async ()=>{
    await sb.from('players').delete().eq('id', MY_ID);
  });
}

async function pushPosition(){
  if(!myLobby) return;
  await sb.from('players').upsert({
    id: MY_ID, lobby: myLobby,
    x: Math.round(pState.pos.x*100)/100,
    y: Math.round(pState.pos.y*100)/100,
    z: Math.round(pState.pos.z*100)/100,
    yaw: Math.round(pState.yaw*1000)/1000,
    health: pState.health,
    updated_at: Date.now()
  });
}

// ─── Physics ──────────────────────────────────────────────────────────────────
const GRAVITY=-20, JUMP_VEL=7, WALK_SPD=5, SPRINT_MULT=1.7;
const STAM_DRAIN=30, STAM_REGEN=20;
const FLOOR_Y=PH/2;
const clock=new THREE.Clock();
let bobTime=0;
const pillSprint=document.getElementById('pill-sprint');
const pillJump=document.getElementById('pill-jump');

function update(dt){
  // Physics always runs
  pState.vel.y += GRAVITY*dt;
  pState.pos.addScaledVector(pState.vel,dt);
  if(pState.pos.y<=FLOOR_Y){ pState.pos.y=FLOOR_Y; pState.vel.y=0; pState.onGround=true; }
  else { pState.onGround=false; }

  playerGroup.position.copy(pState.pos);
  playerGroup.rotation.y=pState.yaw;
  camera.position.set(pState.pos.x, pState.pos.y+EYE-PH/2, pState.pos.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=pState.yaw;
  camera.rotation.x=pState.pitch+recoilOff.y;

  // Smooth remote players
  for(const id in remotePlayers){
    const rp=remotePlayers[id];
    const t=rp.target; const m=rp.mesh.position;
    m.x=THREE.MathUtils.lerp(m.x,t.x,0.2);
    m.y=THREE.MathUtils.lerp(m.y,t.y,0.2);
    m.z=THREE.MathUtils.lerp(m.z,t.z,0.2);
    rp.mesh.rotation.y=THREE.MathUtils.lerp(rp.mesh.rotation.y,t.yaw,0.2);
  }

  if(!gameStarted) return;

  const wpn=WEAPONS[pState.weaponIdx];
  if(pState.shootCD>0) pState.shootCD-=dt;
  const canShoot=pState.shootCD<=0&&!pState.reloading&&pState.ammo>0;
  if(wpn.auto ? mouseDown : (mouseDown&&!prevMouseDown)){ if(canShoot) shoot(); }
  prevMouseDown=mouseDown;

  if(pState.reloading){
    pState.reloadTimer-=dt;
    if(pState.reloadTimer<=0){
      const need=wpn.ammoMax-pState.ammo, give=Math.min(need,pState.reserve);
      pState.ammo+=give; pState.reserve-=give; pState.reloading=false; updateAmmoHUD();
    }
  }

  const fwd  =new THREE.Vector3(-Math.sin(pState.yaw),0,-Math.cos(pState.yaw));
  const right=new THREE.Vector3( Math.cos(pState.yaw),0,-Math.sin(pState.yaw));
  const dir=new THREE.Vector3();
  if(keys['KeyW']) dir.add(fwd);
  if(keys['KeyS']) dir.sub(fwd);
  if(keys['KeyA']) dir.sub(right);
  if(keys['KeyD']) dir.add(right);
  if(dir.lengthSq()>0) dir.normalize();

  const sprint=keys['ShiftLeft']&&dir.lengthSq()>0&&pState.stamina>0;
  pState.stamina=sprint?Math.max(0,pState.stamina-STAM_DRAIN*dt):Math.min(100,pState.stamina+STAM_REGEN*dt);
  document.getElementById('sprint-bar').style.width=pState.stamina+'%';
  pillSprint.classList.toggle('active',sprint);

  pState.vel.x=dir.x*WALK_SPD*(sprint?SPRINT_MULT:1);
  pState.vel.z=dir.z*WALK_SPD*(sprint?SPRINT_MULT:1);

  if(keys['Space']&&pState.onGround){
    pState.vel.y=JUMP_VEL; pState.onGround=false;
    pillJump.classList.add('active'); setTimeout(()=>pillJump.classList.remove('active'),400);
  }

  const moving=dir.lengthSq()>0&&pState.onGround;
  if(moving) bobTime+=dt*(sprint?14:9);
  recoilOff.multiplyScalar(Math.pow(0.05,dt));
  weaponHolder.position.set(
    (moving?Math.sin(bobTime)*0.012:0)+recoilOff.x,
    moving?Math.abs(Math.sin(bobTime))*0.008:0, 0
  );

  for(let i=tracers.length-1;i>=0;i--){
    const t=tracers[i]; t.life-=dt;
    t.mesh.position.addScaledVector(t.vel,dt);
    if(t.life<=0){ scene.remove(t.mesh); tracers.splice(i,1); }
  }
}

function animate(){
  requestAnimationFrame(animate);
  update(Math.min(clock.getDelta(),0.05));
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
updateHealthHUD(); updateAmmoHUD();
setConnectionStatus(false,'Connecting...');
findLobby().catch(e=>{ setConnectionStatus(false,'Failed'); console.error(e); });
animate();
</script>
</body>
</html>
