<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050816;
    color:white;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at top,#4f46e5,transparent 40%),
               radial-gradient(circle at bottom,#06b6d4,transparent 40%);
    z-index:-2;
}

.container{
    padding:40px;
    text-align:center;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:40px;
}

.game{
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.07);
    cursor:pointer;
    transition:0.2s;
    border:1px solid rgba(255,255,255,0.1);
}

.game:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.12);
}

.viewer{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    flex-direction:column;
}

.topbar{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#111;
}

iframe{
    flex:1;
    border:none;
    width:100%;
}

button{
    padding:8px 12px;
    border:none;
    background:red;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
    <h1>Game Hub</h1>
    <p>Auto-loading games from /games</p>

    <div class="games" id="games"></div>
</div>

<div class="viewer" id="viewer">
    <div class="topbar">
        <span id="title">Game</span>
        <button onclick="closeGame()">Close</button>
    </div>
    <iframe id="frame"></iframe>
</div>

<script>
const USER = "YOUR_USERNAME";
const REPO = "YOUR_REPO";

const gamesDiv = document.getElementById("games");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");
const title = document.getElementById("title");

// LOAD GAMES AUTOMATICALLY
async function loadGames(){

    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/games`);
    const data = await res.json();

    data.forEach(item => {

        if(item.type === "dir"){

            createGame(item.name, `games/${item.name}/`);

        }

        if(item.type === "file" && item.name.endsWith(".html")){

            createGame(item.name.replace(".html",""), `games/${item.name}`);

        }

    });

}

function createGame(name, path){

    const div = document.createElement("div");
    div.className = "game";
    div.innerHTML = `<h3>${name}</h3>`;

    div.onclick = () => openGame(name, path);

    gamesDiv.appendChild(div);

}

function openGame(name, path){

    viewer.style.display = "flex";
    title.innerText = name;

    if(path.endsWith("/")){
        frame.src = path + "index.html";
    } else {
        frame.src = path;
    }
}

function closeGame(){
    viewer.style.display = "none";
    frame.src = "";
}

loadGames();
</script>

</body>
</html>
