<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Hub</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#050816;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top,#6366f1,transparent 40%),
        radial-gradient(circle at bottom,#22d3ee,transparent 40%);
    z-index:-2;
}

.header{
    text-align:center;
    padding:40px 20px;
}

h1{
    font-size:3rem;
    margin:0;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px 40px;
}

.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:15px;
    padding:20px;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.1);
}

.viewer{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    flex-direction:column;
}

.topbar{
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
    background:#111;
}

iframe{
    flex:1;
    width:100%;
    border:none;
}

button{
    background:red;
    border:none;
    color:white;
    padding:8px 12px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="header">
    <h1>🎮 Games Hub</h1>
    <p>Auto-loading from /games</p>
</div>

<div class="games" id="games"></div>

<div class="viewer" id="viewer">
    <div class="topbar">
        <span id="title">Game</span>
        <button onclick="closeGame()">Close</button>
    </div>
    <iframe id="frame"></iframe>
</div>

<script>

// 🔥 IMPORTANT: your GitHub repo info
const USER = "charliedayfockens-hue";
const REPO = "games-hub";

const gamesDiv = document.getElementById("games");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");
const title = document.getElementById("title");

// 📦 Auto load games from GitHub folder
async function loadGames(){

    const url = `https://api.github.com/repos/${USER}/${REPO}/contents/games`;

    const res = await fetch(url);
    const data = await res.json();

    if(!Array.isArray(data)){
        gamesDiv.innerHTML = "<p>Failed to load games.</p>";
        return;
    }

    data.forEach(item => {

        // folder game
        if(item.type === "dir"){
            createGame(item.name, `games/${item.name}/`);
        }

        // single file game
        if(item.type === "file" && item.name.endsWith(".html")){
            createGame(item.name.replace(".html",""), `games/${item.name}`);
        }

    });

}

// 🧱 create button
function createGame(name, path){

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${name}</h3><p>Click to play</p>`;

    div.onclick = () => openGame(name, path);

    gamesDiv.appendChild(div);

}

// ▶ open game
function openGame(name, path){

    viewer.style.display = "flex";
    title.textContent = name;

    if(path.endsWith("/")){
        frame.src = path + "index.html";
    } else {
        frame.src = path;
    }

}

// ❌ close game
function closeGame(){
    viewer.style.display = "none";
    frame.src = "";
}

loadGames();

</script>

</body>
</html>
